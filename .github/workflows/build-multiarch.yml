name: Build multi-arch (AstraChat enterprise)

# Gera e publica a imagem "enterprise" (baked) para linux/amd64 + linux/arm64
# no Docker Hub, para ninguém precisar buildar na hora de instalar.
#
# Pré-requisitos (Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME = seu usuário do Docker Hub
#   DOCKERHUB_TOKEN    = access token do Docker Hub (Read & Write)
#
# Rode em: Actions > "Build multi-arch (AstraChat enterprise)" > Run workflow

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.bake'
      - 'patches/**'
      - '.github/workflows/build-multiarch.yml'

env:
  IMAGE: edwardbra/astrachat:enterprise
  # Base = mesma versão que o serviço roda (AstraChat 4.19.1)
  BASE_IMAGE: astraonline/astrachat:v4.19.1-0.0.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: QEMU (emulação p/ cross-build)
        uses: docker/setup-qemu-action@v3

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build + push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.bake
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
          provenance: false
          sbom: false

      - name: Resumo
        run: |
          echo "Publicado: $IMAGE (linux/amd64, linux/arm64)"
          docker buildx imagetools inspect "$IMAGE" || true
